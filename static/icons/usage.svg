<svg xmlns="http://www.w3.org/2000/svg" viewBox="-122 -122 244 244" width="100%" height="100%" role="img" aria-label="Usage">
  <!-- Bridge tab icon: Usage (drawn to match the Moment Jar / Pulse Check / Ritual Builder set) -->
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAF9F6" />
      <stop offset="100%" stop-color="#F2EFE9" />
    </radialGradient>

    <!-- Colors -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B4C7E"/>
      <stop offset="100%" stop-color="#4A7BB0"/>
    </linearGradient>

    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07A5F"/>
      <stop offset="100%" stop-color="#F4A261"/>
    </linearGradient>

    <!-- Drop Shadow for Icon Plates -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2B4C7E" flood-opacity="0.08"/>
    </filter>
  </defs>
  <g>
    <circle cx="0" cy="0" r="110" fill="#FFFFFF" filter="url(#softShadow)" />
    <!-- Three bars: one per partner color, the bridge mauve in between -->
    <rect x="-58" y="-2" width="30" height="58" rx="8" fill="url(#blueGrad)" stroke="#2B4C7E" stroke-width="3"/>
    <rect x="-15" y="-34" width="30" height="90" rx="8" fill="#9B7287" stroke="#2B4C7E" stroke-width="3"/>
    <rect x="28" y="-62" width="30" height="118" rx="8" fill="url(#coralGrad)" stroke="#2B4C7E" stroke-width="3"/>
    <!-- Baseline -->
    <line x1="-72" y1="64" x2="72" y2="64" stroke="#2B4C7E" stroke-width="5" stroke-linecap="round"/>
    <!-- Coin -->
    <circle cx="-48" cy="-48" r="17" fill="#E9C46A" stroke="#A57548" stroke-width="3"/>
    <path d="M-48,-58 L-48,-38 M-53,-53 C-53,-57 -43,-57 -43,-53 C-43,-48 -53,-49 -53,-44 C-53,-40 -43,-40 -43,-44" fill="none"
          stroke="#A57548" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Sparkle -->
    <circle cx="62" cy="-78" r="4" fill="#E9C46A"/>
  </g>
</svg>
