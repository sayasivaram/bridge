<svg xmlns="http://www.w3.org/2000/svg" viewBox="-122 -122 244 244" width="100%" height="100%" role="img" aria-label="Pulse Check">
  <!-- Bridge tab icon: Pulse Check -->
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAF9F6" />
      <stop offset="100%" stop-color="#F2EFE9" />
    </radialGradient>

    <!-- Colors -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B4C7E"/>
      <stop offset="100%" stop-color="#4A7BB0"/>
    </linearGradient>

    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07A5F"/>
      <stop offset="100%" stop-color="#F4A261"/>
    </linearGradient>

    <!-- Drop Shadow for Icon Plates -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2B4C7E" flood-opacity="0.08"/>
    </filter>
  </defs>
  <g>
    <!-- Base Plate -->
    <circle cx="0" cy="0" r="110" fill="#FFFFFF" filter="url(#softShadow)" />

    <!-- Pulse Heart Outer Path -->
    <path d="M0,60 C-60,20 -85,-20 -50,-60 C-20,-90 0,-40 0,-40 C0,-40 20,-90 50,-60 C85,-20 60,20 0,60 Z" 
          fill="none" stroke="#E07A5F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Heartbeat Line across the center -->
    <path d="M-75,0 L-35,0 L-20,-25 L-5,30 L15,-35 L30,10 L45,0 L75,0" 
          fill="none" stroke="#2B4C7E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Sparkles/Pulsing Elements -->
    <path d="M-55,-40 L-50,-50 L-40,-45 L-50,-40 Z" fill="#F4A261"/>
    <path d="M45,-45 L55,-50 L50,-35 Z" fill="#F4A261"/>
    <circle cx="0" cy="-65" r="5" fill="#E07A5F"/>
  </g>
</svg>
