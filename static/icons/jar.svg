<svg xmlns="http://www.w3.org/2000/svg" viewBox="-122 -122 244 244" width="100%" height="100%" role="img" aria-label="Moment Jar">
  <!-- Bridge tab icon: Moment Jar -->
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAF9F6" />
      <stop offset="100%" stop-color="#F2EFE9" />
    </radialGradient>

    <!-- Colors -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B4C7E"/>
      <stop offset="100%" stop-color="#4A7BB0"/>
    </linearGradient>

    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07A5F"/>
      <stop offset="100%" stop-color="#F4A261"/>
    </linearGradient>

    <!-- Drop Shadow for Icon Plates -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2B4C7E" flood-opacity="0.08"/>
    </filter>
  </defs>
  <g>
    <!-- Base Plate -->
    <circle cx="0" cy="0" r="110" fill="#FFFFFF" filter="url(#softShadow)" />
    
    <!-- Glass Jar Outer -->
    <path d="M-40,-50 L40,-50 C45,-50 50,-40 45,-20 C55,0 60,30 50,60 C42,80 25,85 0,85 C-25,85 -42,80 -50,60 C-60,30 -55,0 -45,-20 C-50,-40 -45,-50 -40,-50 Z" 
          fill="#EBF3FA" stroke="#2B4C7E" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Cork Lid -->
    <path d="M-35,-68 L35,-68 C38,-68 40,-60 38,-50 L-38,-50 C-40,-60 -38,-68 -35,-68 Z" 
          fill="#D4A373" stroke="#A57548" stroke-width="3" stroke-linejoin="round"/>

    <!-- Jar Highlights -->
    <path d="M-42,-15 C-48,15 -42,45 -35,55" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>

    <!-- Moments Inside Jar (Cute Shapes) -->
    <!-- Heart -->
    <path d="M-15,35 C-25,20 -5,10 0,25 C5,10 25,20 15,35 C5,45 0,50 0,50 C0,50 -5,45 -15,35 Z" fill="#E07A5F"/>
    <!-- Music Note -->
    <circle cx="-20" cy="0" r="6" fill="#F4A261"/>
    <path d="M-14,0 L-14,-18 L2,-12 L2,6" fill="none" stroke="#F4A261" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-4" cy="6" r="6" fill="#F4A261"/>
    <!-- Star -->
    <path d="M22,10 L25,18 L33,18 L27,23 L29,31 L22,26 L15,31 L17,23 L11,18 L19,18 Z" fill="#E9C46A"/>
    <!-- Little Smile Candy -->
    <circle cx="0" cy="-15" r="10" fill="#81B29A"/>
    <path d="M-4,-15 A 4 4 0 0 0 4 -15" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

    <!-- Tag -->
    <path d="M25,-30 L45,-20 L35,0 L15,-10 Z" fill="#F4F1DE" stroke="#A57548" stroke-width="2"/>
    <circle cx="22" cy="-22" r="2" fill="#A57548"/>
    <line x1="12" y1="-30" x2="22" y2="-22" stroke="#A57548" stroke-width="2"/>
  </g>
</svg>
